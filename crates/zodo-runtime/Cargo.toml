[package]
name = "zodo-runtime"
version = "0.1.0"
description = "Zodo SQLite runtime, loopback API and CLI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "zodo_runtime"
path = "src/lib.rs"

[[bin]]
name = "zodo"
path = "src/main.rs"

[dependencies]
zodo-kernel = { path = "../zodo-kernel" }
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
dirs.workspace = true
fs2.workspace = true
hex.workspace = true
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-core = "0.3"
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
